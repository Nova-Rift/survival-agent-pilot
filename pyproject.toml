[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-agent-pilot"
version = "0.1.0"
description = "Bounded multiagent survival research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["survival-env @ git+https://github.com/Nova-Rift/survival-env.git@e4d3f66a3f870fefe7340e35f206b587eb0c69e4", "survival-agent @ git+https://github.com/Nova-Rift/survival-agent.git@4b54ed9b08ad0d4bd9e23126ed85421802b48dbb"]

[project.optional-dependencies]
agent = ["torch>=2.10.0,<3", "safetensors>=0.7.0,<1"]
language = ["torch>=2.10.0,<3", "safetensors>=0.7.0,<1", "transformers>=5.10.0,<6", "Jinja2>=3.1.6,<4"]

[tool.setuptools.packages.find]
include = ["survival_adapters*"]
